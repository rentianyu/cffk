name: Update CFFK

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: update-cffk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout instance repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        shell: bash
        run: |
          set -euo pipefail

          # Keep instance-specific files: Cloudflare bindings (wrangler.jsonc)
          # and the CI workflows under .github/.
          mkdir -p "$RUNNER_TEMP/keep"
          if [ -f wrangler.jsonc ]; then cp wrangler.jsonc "$RUNNER_TEMP/keep/wrangler.jsonc"; fi
          if [ -d .github ]; then cp -r .github "$RUNNER_TEMP/keep/github"; fi

          git fetch https://github.com/34892002/cffk.git main
          git reset --hard FETCH_HEAD
          upstream_sha="$(git rev-parse --short HEAD)"

          if [ -f "$RUNNER_TEMP/keep/wrangler.jsonc" ]; then cp "$RUNNER_TEMP/keep/wrangler.jsonc" wrangler.jsonc; fi
          if [ -d "$RUNNER_TEMP/keep/github" ]; then rm -rf .github; cp -r "$RUNNER_TEMP/keep/github" .github; fi

          git config user.name "CFFK Updater"
          git config user.email "actions@github.com"

          if git diff --quiet; then
            echo "CFFK is already up to date."
          else
            git add -A
            git commit -m "Update CFFK to ${upstream_sha}"
          fi

          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
